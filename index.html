<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastLink | IndustriasTech</title>
    <meta name="theme-color" content="#1d4ed8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231d4ed8'/><circle cx='50' cy='50' r='20' fill='white'/></svg>">
    
    <style>
        :root {
            --primary: #1d4ed8; --primary-dark: #1e3a8a; --bg: #f1f5f9;
            --surface: #ffffff; --text: #0f172a; --text-muted: #64748b;
            --border: #e2e8f0; --danger: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Notificaciones Tipo "Toast" (Reemplazan al alert) */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
        .toast { background: var(--surface); color: var(--text); padding: 15px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; font-weight: bold; border-left: 5px solid var(--primary); animation: slideInDown 0.3s forwards, fadeOut 0.3s 2.7s forwards; }
        .toast.error { border-left-color: var(--danger); }
        @keyframes slideInDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        /* Pantalla Login */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; background: var(--surface); z-index: 2000; position: absolute; width: 100%; top: 0; }
        .login-box { width: 100%; max-width: 350px; text-align: center; }
        .login-box h1 { color: var(--primary); margin-bottom: 5px; }
        .login-box input { width: 100%; padding: 15px; margin: 15px 0; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; outline: none; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #app-screen { display: none; flex-direction: column; height: 100%; }

        /* Header (Título Clickeable para Recargar) */
        .app-header { background: var(--primary); color: white; padding: 15px 15px 0 15px; z-index: 10; }
        .app-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; text-align: center; color: white; text-decoration: none; display: block; cursor: pointer; }
        
        .tabs-container { display: flex; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; gap: 10px; }
        .tab { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 16px; border-radius: 20px; font-size: 14px; white-space: nowrap; cursor: pointer; }
        .tab.active { background: var(--surface); color: var(--primary); font-weight: bold; }
        .tab-count { background: rgba(0,0,0,0.1); border-radius: 10px; padding: 2px 6px; font-size: 11px; margin-left: 5px; }
        .tab.active .tab-count { background: var(--bg); color: var(--text-muted); }

        .content-area { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .link-card { background: var(--surface); border-radius: 12px; padding: 15px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--border); }
        .link-icon { width: 40px; height: 40px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; margin-top: 2px;}
        .link-icon img { width: 100%; height: 100%; object-fit: cover; }
        .link-info { flex: 1; overflow: hidden; cursor: pointer; }
        .link-title { font-weight: bold; font-size: 15px; margin: 0 0 4px 0; }
        .link-url { color: var(--primary); font-size: 12px; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .link-notes { color: var(--text-muted); font-size: 12px; margin: 0; font-style: italic; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
        .link-options { background: none; border: none; color: var(--text-muted); font-size: 20px; padding: 5px; cursor: pointer; }

        /* Barra Inferior */
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding: 10px 0; z-index: 100; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; display: flex; flex-direction: column; align-items: center; flex: 1; }
        .nav-item span { font-size: 10px; margin-top: 4px; }
        .nav-item.active { color: var(--primary); }
        .fab { background: var(--primary); color: white; width: 50px; height: 50px; border-radius: 25px; border: none; font-size: 24px; box-shadow: 0 4px 10px rgba(29, 78, 216, 0.3); transform: translateY(-15px); cursor: pointer; }

        /* Modales Generales */
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: flex-end; justify-content: center; }
        .modal-content { background: var(--surface); width: 100%; border-radius: 20px 20px 0 0; padding: 25px 20px; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); animation: slideUp 0.3s ease-out; max-height: 90vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; font-size: 18px; }
        .close-btn { background: var(--bg); border: none; width: 30px; height: 30px; border-radius: 15px; font-weight: bold; cursor: pointer; }

        .input-group { margin-bottom: 15px; position: relative;}
        .input-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; background: var(--bg); font-family: inherit;}
        
        /* Paleta de Emojis Rápida */
        .btn-emoji-trigger { position: absolute; right: 10px; top: 28px; background: none; border: none; font-size: 18px; cursor: pointer; }
        .emoji-palette { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 5px; grid-template-columns: repeat(8, 1fr); gap: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .emoji-palette span { font-size: 20px; cursor: pointer; text-align: center; user-select: none; }

        .flex-btns { display: flex; gap: 10px; margin-top: 15px;}
        .btn-secondary { background: var(--bg); color: var(--text); border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-danger-outline { background: none; color: var(--danger); border: 1px solid var(--danger); padding: 12px; width: 100%; border-radius: 10px; font-size: 14px; cursor: pointer; margin-top: 10px;}

        /* Modal de Confirmación Estilizado (Reemplaza al confirm) */
        #modal-confirmar .modal-content { max-width: 400px; border-radius: 20px; align-self: center; margin: 20px; text-align: center; animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        #modal-confirmar h3 { color: var(--danger); }
    </style>
</head>
<body onload="initApp()">

    <!-- Contenedor de Notificaciones -->
    <div id="toast-container"></div>

    <div id="login-screen">
        <div class="login-box">
            <svg width="60" height="60" viewBox="0 0 100 100" style="margin-bottom: 10px;"><rect width="100" height="100" rx="20" fill="#1d4ed8"/><circle cx="50" cy="50" r="20" fill="white"/></svg>
            <h1>FastLink</h1>
            <p style="color: var(--text-muted); margin-top:0;">Bóveda Segura</p>
            <input type="password" id="pwd" placeholder="Contraseña Maestra">
            <button class="btn-main" id="btn-login" onclick="autenticar()">Desbloquear</button>
        </div>
    </div>

    <div id="app-screen">
        <div class="app-header">
            <!-- Título Clickeable: al dejar href="" recarga la misma página automáticamente -->
            <a href="https://industriastech.github.io/Lista-de-Enlaces-Marcadores/" class="app-title">Mis Enlaces</a>
            <div class="tabs-container" id="pestanas-container"></div>
        </div>

        <div class="content-area" id="enlaces-container"></div>

        <div class="bottom-bar">
            <button class="nav-item active" onclick="cerrarModales()">🏠<span>Inicio</span></button>
            <button class="fab" onclick="abrirModalEnlace()">➕</button>
            <button class="nav-item" onclick="abrirGestorPestanas()">📑<span>Pestañas</span></button>
        </div>
    </div>

    <!-- Modal Formulario Enlace -->
    <div id="modal-enlace" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-enlace-titulo">Añadir Enlace</h3>
                <button class="close-btn" onclick="cerrarModales()">✕</button>
            </div>
            
            <div class="input-group">
                <label>Título del Enlace</label>
                <input type="text" id="link-titulo" placeholder="Ej. Película Completa">
                <button class="btn-emoji-trigger" onclick="toggleEmojiPalette('link-titulo', 'palette-titulo')">😀</button>
                <div class="emoji-palette" id="palette-titulo"></div>
            </div>

            <div class="input-group">
                <label>Enlace (URL)</label>
                <input type="url" id="link-url" placeholder="https://..." onblur="intentarExtraerTitulo()">
            </div>
            
            <div class="input-group">
                <label>Notas / Descripción (Opcional)</label>
                <textarea id="link-notas" rows="2" placeholder="Ej. Ver el día de mañana..."></textarea>
            </div>

            <div class="input-group">
                <label>Guardar en Pestaña</label>
                <select id="link-pestana"></select>
            </div>

            <div class="flex-btns">
                <button class="btn-secondary" onclick="cerrarModales()">Cancelar</button>
                <button class="btn-main" id="btn-guardar-enlace" onclick="guardarEnlace()">Guardar</button>
            </div>
            <button id="btn-eliminar-enlace" class="btn-danger-outline" style="display:none;" onclick="pedirConfirmacion('¿Deseas eliminar este enlace de tu bóveda?', eliminarEnlace)">🗑️ Eliminar este enlace</button>
        </div>
    </div>

    <!-- Modal Formulario Pestaña -->
    <div id="modal-pestana" class="modal-overlay" style="z-index: 1100;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-pestana-titulo">Nueva Pestaña</h3>
                <button class="close-btn" onclick="document.getElementById('modal-pestana').style.display='none'">✕</button>
            </div>
            <div class="input-group">
                <label>Nombre y Emoji</label>
                <input type="text" id="tab-nombre" placeholder="Ej. 🎥 Películas">
                <button class="btn-emoji-trigger" onclick="toggleEmojiPalette('tab-nombre', 'palette-tab')">😀</button>
                <div class="emoji-palette" id="palette-tab"></div>
            </div>
            <div class="flex-btns">
                <button class="btn-secondary" onclick="document.getElementById('modal-pestana').style.display='none'">Cancelar</button>
                <button class="btn-main" id="btn-guardar-pestana" onclick="guardarPestana()">Guardar</button>
            </div>
            <button id="btn-eliminar-pestana" class="btn-danger-outline" style="display:none;" onclick="pedirConfirmacion('¿Borrar pestaña y TODOS sus enlaces?', eliminarPestana)">🗑️ Eliminar Pestaña</button>
        </div>
    </div>

    <!-- Modal Gestor de Pestañas -->
    <div id="modal-gestor" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Gestionar Pestañas</h3>
                <button class="close-btn" onclick="cerrarModales()">✕</button>
            </div>
            <button class="btn-main" style="margin-bottom: 15px;" onclick="abrirModalPestana()">+ Crear Nueva Pestaña</button>
            <div id="lista-gestor-pestanas"></div>
        </div>
    </div>

    <!-- Modal de Confirmación Estilizado -->
    <div id="modal-confirmar" class="modal-overlay" style="z-index: 2000;">
        <div class="modal-content">
            <h3>Atención</h3>
            <p id="confirm-msg" style="color: var(--text-muted); margin-bottom: 20px;"></p>
            <div class="flex-btns">
                <button class="btn-secondary" onclick="document.getElementById('modal-confirmar').style.display='none'">Cancelar</button>
                <button class="btn-main" style="background: var(--danger);" id="btn-confirm-action">Eliminar</button>
            </div>
        </div>
    </div>

    <script>
        // Tu nuevo enlace de Google Apps Script integrado
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxulvOiJ26Ad7vjHnoVIa9PsHv6dyN25yL8tSib1HNx7h8ZP_JOfGNXeFyaBLayKAWftQ/exec";
        
        let bd_pestanas = []; let bd_enlaces = []; let pwdActual = "";
        let pestanaActivaID = null; let enlaceEnEdicion = null; let pestanaEnEdicion = null;

        // Lista de Emojis Rápidos (Puedes agregar los que quieras aquí)
        const emojisRapidos = ['🔥','🎬','🎥','📁','📚','⭐','✅','🤖','🎵','💡','⚙️','🚀','📌','🎮','📱','💻'];

        /* --- SISTEMA DE TOASTS Y CONFIRMACIÓN --- */
        function mostrarToast(mensaje, tipo = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerHTML = tipo === 'success' ? `✅ ${mensaje}` : `⚠️ ${mensaje}`;
            container.appendChild(toast);
            setTimeout(() => { if(toast.parentNode) toast.parentNode.removeChild(toast); }, 3000);
        }

        function pedirConfirmacion(mensaje, funcionEjecutar) {
            document.getElementById('confirm-msg').innerText = mensaje;
            const btn = document.getElementById('btn-confirm-action');
            btn.onclick = () => {
                document.getElementById('modal-confirmar').style.display = 'none';
                funcionEjecutar();
            };
            document.getElementById('modal-confirmar').style.display = 'flex';
        }

        /* --- PALETA DE EMOJIS RÁPIDOS --- */
        function toggleEmojiPalette(inputId, paletteId) {
            const palette = document.getElementById(paletteId);
            if (palette.style.display === 'grid') {
                palette.style.display = 'none';
            } else {
                palette.innerHTML = '';
                emojisRapidos.forEach(em => {
                    const span = document.createElement('span');
                    span.innerText = em;
                    span.onclick = () => {
                        const input = document.getElementById(inputId);
                        input.value += em; 
                        input.focus(); // Devuelve el foco para seguir escribiendo
                    };
                    palette.appendChild(span);
                });
                palette.style.display = 'grid';
            }
        }

        /* --- INICIALIZACIÓN Y LOGIN --- */
        function initApp() {
            const guardada = localStorage.getItem("fastlink_pwd");
            if(guardada) {
                document.getElementById('pwd').value = guardada;
                autenticar();
            }
        }

        async function autenticar() {
            const pwd = document.getElementById('pwd').value;
            const btn = document.getElementById('btn-login');
            if(!pwd) return mostrarToast("Ingresa la contraseña maestra", "error");

            btn.innerHTML = `<div class="spinner"></div>`;
            try {
                const res = await fetch(GAS_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, 
                    body: new URLSearchParams({ 'password': pwd, 'accion': 'obtener_todo' }), 
                    redirect: 'follow' 
                });
                const datos = await res.json();

                if(datos.status === "success") {
                    pwdActual = pwd;
                    localStorage.setItem("fastlink_pwd", pwd);
                    bd_pestanas = datos.pestanas; 
                    bd_enlaces = datos.enlaces;
                    
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'flex';
                    if(bd_pestanas.length > 0 && !pestanaActivaID) pestanaActivaID = bd_pestanas[0].id;
                    renderizarUI();
                } else {
                    mostrarToast("Contraseña incorrecta", "error");
                    localStorage.removeItem("fastlink_pwd");
                    btn.innerHTML = "Desbloquear";
                }
            } catch (e) {
                mostrarToast("Error de conexión con la Bóveda", "error");
                btn.innerHTML = "Desbloquear";
            }
        }

        async function recargarDatosSilencioso() {
            const res = await fetch(GAS_URL, { 
                method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, 
                body: new URLSearchParams({ 'password': pwdActual, 'accion': 'obtener_todo' }), redirect: 'follow' 
            });
            const datos = await res.json();
            if(datos.status === "success") {
                bd_pestanas = datos.pestanas; bd_enlaces = datos.enlaces;
                renderizarUI();
                if(document.getElementById('modal-gestor').style.display === 'flex') renderizarGestorPestanas();
            }
        }

        /* --- RENDERIZADO VISUAL --- */
        function renderizarUI() {
            const container = document.getElementById('pestanas-container');
            container.innerHTML = "";
            bd_pestanas.forEach(p => {
                const count = bd_enlaces.filter(e => e.id_pestana == p.id).length;
                const btn = document.createElement('button');
                btn.className = `tab ${(p.id == pestanaActivaID) ? 'active' : ''}`;
                btn.onclick = () => { pestanaActivaID = p.id; renderizarUI(); };
                btn.innerHTML = `${p.nombre} <span class="tab-count">${count}</span>`;
                container.appendChild(btn);
            });

            const linkContainer = document.getElementById('enlaces-container');
            linkContainer.innerHTML = "";
            const filtrados = bd_enlaces.filter(e => e.id_pestana == pestanaActivaID);
            
            filtrados.reverse().forEach(e => {
                let linkFinal = e.enlace.startsWith('http') ? e.enlace : 'https://' + e.enlace;
                let iconoUrl = `https://www.google.com/s2/favicons?domain=${new URL(linkFinal).hostname}&sz=64`;
                
                const card = document.createElement('div');
                card.className = "link-card";
                card.innerHTML = `
                    <div class="link-icon"><img src="${iconoUrl}" onerror="this.style.display='none'"></div>
                    <div class="link-info" onclick="window.open('${linkFinal}', '_blank')">
                        <h4 class="link-title">${e.titulo}</h4>
                        <p class="link-url">${linkFinal}</p>
                        ${e.notas ? `<p class="link-notes">${e.notas}</p>` : ''}
                    </div>
                    <button class="link-options" onclick="abrirModalEnlace('${e.id}')">⋮</button>
                `;
                linkContainer.appendChild(card);
            });
        }

        function cerrarModales() { 
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); 
            document.querySelectorAll('.emoji-palette').forEach(p => p.style.display = 'none');
        }

        /* --- GESTIÓN DE ENLACES --- */
        function abrirModalEnlace(id = null) {
            if(bd_pestanas.length === 0) return mostrarToast("Crea una pestaña primero", "error");
            enlaceEnEdicion = id;
            
            const select = document.getElementById('link-pestana');
            select.innerHTML = "";
            bd_pestanas.forEach(p => { select.innerHTML += `<option value="${p.id}">${p.nombre}</option>`; });

            if(id) {
                document.getElementById('modal-enlace-titulo').innerText = "Editar Enlace";
                document.getElementById('btn-eliminar-enlace').style.display = "block";
                const en = bd_enlaces.find(e => e.id == id);
                document.getElementById('link-url').value = en.enlace;
                document.getElementById('link-titulo').value = en.titulo;
                document.getElementById('link-notas').value = en.notas || "";
                select.value = en.id_pestana;
            } else {
                document.getElementById('modal-enlace-titulo').innerText = "Añadir Enlace";
                document.getElementById('btn-eliminar-enlace').style.display = "none";
                document.getElementById('link-url').value = ""; document.getElementById('link-titulo').value = ""; document.getElementById('link-notas').value = "";
                select.value = pestanaActivaID;
            }
            document.getElementById('modal-enlace').style.display = "flex";
        }

        function intentarExtraerTitulo() {
            const url = document.getElementById('link-url').value;
            const titulo = document.getElementById('link-titulo');
            if(url && !titulo.value) {
                try { titulo.value = new URL(url.startsWith('http')?url:'https://'+url).hostname.replace('www.','').split('.')[0].toUpperCase(); } catch(e){}
            }
        }

        async function guardarEnlace() {
            const url = document.getElementById('link-url').value;
            if(!url) return mostrarToast("El enlace es obligatorio", "error");

            const btn = document.getElementById('btn-guardar-enlace');
            btn.innerHTML = `<div class="spinner"></div>`; btn.disabled = true;

            const payload = {
                password: pwdActual, accion: enlaceEnEdicion ? 'editar_enlace' : 'agregar_enlace',
                titulo: document.getElementById('link-titulo').value || "Enlace", enlace: url,
                id_pestana: document.getElementById('link-pestana').value, notas: document.getElementById('link-notas').value
            };
            if(enlaceEnEdicion) payload.fila = bd_enlaces.find(e => e.id == enlaceEnEdicion).fila;

            await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(payload), redirect: 'follow' });
            
            pestanaActivaID = payload.id_pestana;
            cerrarModales(); btn.innerHTML = "Guardar"; btn.disabled = false;
            mostrarToast("Enlace guardado correctamente");
            recargarDatosSilencioso();
        }

        async function eliminarEnlace() {
            const obj = bd_enlaces.find(e => e.id == enlaceEnEdicion);
            cerrarModales();
            mostrarToast("Eliminando enlace...");
            await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ password: pwdActual, accion: 'eliminar_enlace', fila: obj.fila }), redirect: 'follow' });
            recargarDatosSilencioso();
        }

        /* --- GESTIÓN DE PESTAÑAS --- */
        function abrirGestorPestanas() { renderizarGestorPestanas(); document.getElementById('modal-gestor').style.display = "flex"; }

        function renderizarGestorPestanas() {
            const list = document.getElementById('lista-gestor-pestanas');
            list.innerHTML = "";
            bd_pestanas.forEach((p, index) => {
                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items: center; padding:12px; border-bottom:1px solid var(--border);">
                        <div style="font-weight:bold;">${p.nombre}</div>
                        <div style="display:flex; gap:5px;">
                            <button style="background:var(--bg); border:none; border-radius:5px; padding:6px 10px; color:#10b981; font-size:16px;" onclick="ejecutarMover(${index}, 'up')">⬆️</button>
                            <button style="background:var(--bg); border:none; border-radius:5px; padding:6px 10px; color:#f59e0b; font-size:16px;" onclick="ejecutarMover(${index}, 'down')">⬇️</button>
                            <button style="background:var(--bg); border:none; border-radius:5px; padding:6px 10px; font-size:16px;" onclick="abrirModalPestana('${p.id}')">✏️</button>
                        </div>
                    </div>`;
            });
        }

        async function ejecutarMover(index, dir) {
            if (dir === 'up' && index === 0) return; 
            if (dir === 'down' && index === bd_pestanas.length - 1) return; 

            const act = bd_pestanas[index], dest = dir === 'up' ? bd_pestanas[index - 1] : bd_pestanas[index + 1];
            mostrarToast("Actualizando orden...");
            await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ password: pwdActual, accion: 'mover_pestana', fila: act.fila, fila_destino: dest.fila, orden_actual: act.orden, orden_destino: dest.orden }), redirect: 'follow' });
            recargarDatosSilencioso();
        }

        function abrirModalPestana(id = null) {
            pestanaEnEdicion = id;
            if(id) {
                document.getElementById('modal-pestana-titulo').innerText = "Editar Pestaña";
                document.getElementById('btn-eliminar-pestana').style.display = "block";
                document.getElementById('tab-nombre').value = bd_pestanas.find(x => x.id == id).nombre;
            } else {
                document.getElementById('modal-pestana-titulo').innerText = "Nueva Pestaña";
                document.getElementById('btn-eliminar-pestana').style.display = "none";
                document.getElementById('tab-nombre').value = "";
            }
            document.getElementById('modal-pestana').style.display = "flex";
        }

        async function guardarPestana() {
            const nombre = document.getElementById('tab-nombre').value;
            if(!nombre) return mostrarToast("Escribe un nombre", "error");

            const btn = document.getElementById('btn-guardar-pestana');
            btn.innerHTML = `<div class="spinner"></div>`; btn.disabled = true;

            const payload = { password: pwdActual, accion: pestanaEnEdicion ? 'editar_pestana' : 'agregar_pestana', nombre: nombre, emoji: "" };
            if(pestanaEnEdicion) payload.fila = bd_pestanas.find(x => x.id == pestanaEnEdicion).fila;

            await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(payload), redirect: 'follow' });
            
            document.getElementById('modal-pestana').style.display = "none";
            btn.innerHTML = "Guardar"; btn.disabled = false;
            mostrarToast("Pestaña guardada");
            recargarDatosSilencioso();
        }

        async function eliminarPestana() {
            const p = bd_pestanas.find(x => x.id == pestanaEnEdicion);
            document.getElementById('modal-pestana').style.display = "none";
            mostrarToast("Eliminando pestaña...");
            await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ password: pwdActual, accion: 'eliminar_pestana', fila: p.fila }), redirect: 'follow' });
            if(pestanaActivaID == p.id) pestanaActivaID = null; 
            recargarDatosSilencioso();
        }
    </script>
</body>
</html>
